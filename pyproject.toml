# Workspace root (virtual: not a package itself). Members live in apps/ and packages/.
[tool.uv.workspace]
members = ["apps/*", "packages/*"]

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Lets isort treat workspace packages as first-party.
src = ["apps/*/src", "packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["apps", "packages"]
exclude = ['/\.venv/']

[tool.pytest.ini_options]
testpaths = ["apps", "packages"]
addopts = ["--import-mode=importlib"]
