[project]
name = "mermia-mock-rpc"
version = "0.1.0"
description = "MermIA mock RPC server: the 11 read RPCs answered with the C3 examples."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "mermia-contracts",
]

[dependency-groups]
dev = [
    "httpx2",
]

[tool.uv.sources]
mermia-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mermia_mock_rpc"]
