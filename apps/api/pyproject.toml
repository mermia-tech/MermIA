[project]
name = "mermia-api"
version = "0.1.0"
description = "MermIA backend: one FastAPI service (channels, agent, ingestion, confirm)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "httpx2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mermia_api"]
