[project]
name = "mermia-api"
version = "0.1.0"
description = "MermIA backend: one FastAPI service (channels, agent, ingestion, confirm)."
requires-python = ">=3.12"
dependencies = [
    "agno==3.1.6",
    "anthropic",
    "fastapi>=0.115",
    "google-genai",
    "uvicorn>=0.34",
    "mermia-contracts",
    "openai",
    "openinference-instrumentation-agno",
    "openpyxl>=3.1",
    "opentelemetry-exporter-otlp-proto-http",
    "opentelemetry-sdk",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "httpx2",
    "types-defusedxml>=0.7.0.20260504",
    "types-openpyxl",
    "types-pyyaml",
]

[tool.uv.sources]
mermia-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mermia_api"]
