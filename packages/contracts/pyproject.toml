[project]
name = "mermia-contracts"
version = "0.1.0"
description = "MermIA contracts: generated database models and the NormalizedBatch parser output"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.11"]

[dependency-groups]
dev = [
    "pytest>=8",
    "psycopg[binary]>=3.2",
    "anthropic>=1.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mermia_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "db: needs the local Supabase database (MERMIA_DB_URL)",
  "rest: needs the local Supabase API (MERMIA_API_URL, MERMIA_JWT_SECRET, MERMIA_API_KEY)",
  "tokens: needs the real token measurement (schemas/tool_tokens.json, made with ANTHROPIC_API_KEY); deferred to the eval ticket",
]
addopts = "-m 'not db and not rest and not tokens'"
