[project]
name = "mermia-fixtures"
version = "0.1.0"
description = "MermIA fixture restaurant 'Taquería El Güero': SQL seed, JSON files and sample SR exports"
requires-python = ">=3.12"
dependencies = ["mermia-contracts", "openpyxl>=3.1"]

[dependency-groups]
dev = ["types-openpyxl"]

[tool.uv.sources]
mermia-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mermia_fixtures"]
