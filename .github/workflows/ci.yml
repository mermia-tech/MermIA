name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-packages --all-groups

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

      - name: Pytest
        run: uv run pytest

  db:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find Supabase project
        id: find
        run: |
          config=$(find . -path ./node_modules -prune -o -path '*/supabase/config.toml' -print -quit)
          if [ -z "$config" ]; then
            echo "No supabase/config.toml yet (added in MR-10/MR-14); skipping pgTAP."
            echo "workdir=" >> "$GITHUB_OUTPUT"
          else
            echo "workdir=$(dirname "$(dirname "$config")")" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.find.outputs.workdir != ''
        with:
          version: latest

      - name: Start database
        if: steps.find.outputs.workdir != ''
        run: supabase db start --workdir "${{ steps.find.outputs.workdir }}"

      - name: Run pgTAP tests
        if: steps.find.outputs.workdir != ''
        run: supabase test db --workdir "${{ steps.find.outputs.workdir }}"
